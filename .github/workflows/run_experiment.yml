name: Run MNIST Baseline Experiment

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'experiments/mnist_baseline/results.txt'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-experiment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install ENDIGate package
        run: pip install -e .

      - name: Verify imports
        run: |
          python -c "from ENDIGate.gates import ENDIGateV4; print('gates OK')"
          python -c "from ENDIGate.training import warmup; print('training OK')"
          python -c "from ENDIGate.extract import extract; print('extract OK')"

      - name: Run MNIST baseline experiment
        run: |
          cd experiments/mnist_baseline
          python run.py

      - name: Upload figures
        uses: actions/upload-artifact@v4
        with:
          name: mnist-baseline-figures
          path: experiments/mnist_baseline/figures/
          retention-days: 30

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: mnist-baseline-results
          path: experiments/mnist_baseline/results.txt
          retention-days: 30

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add experiments/mnist_baseline/results.txt
          git diff --cached --quiet || git commit -m "Update MNIST baseline results"
          git push

      - name: Print results
        run: cat experiments/mnist_baseline/results.txt
